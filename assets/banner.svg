    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
    .shoot { animation: shoot 9s ease-in infinite; opacity: 0; }
    @keyframes shoot { 0%,82% { opacity: 0; transform: translate(0,0) } 84% { opacity: 1 } 92% { opacity: 0; transform: translate(260px,110px) } 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .tw, .cur, .shoot { animation: none; } }
